<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpendWise – Expense Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--bd:#e5e7eb;--ac:#4f46e5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12141b;--card:#1c1f2a;--tx:#eceef5;--mu:#9aa1b2;--bd:#2c3040;--ac:#818cf8}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12141b;--card:#1c1f2a;--tx:#eceef5;--mu:#9aa1b2;--bd:#2c3040;--ac:#818cf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:15px;margin:0 0 10px}
.g{display:grid;gap:12px}.k{grid-template-columns:repeat(3,1fr)}.m{grid-template-columns:1fr 1fr}
@media(max-width:700px){.k,.m{grid-template-columns:1fr}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.big{font-size:24px;font-weight:700}.mu{color:var(--mu);font-size:13px}
form{display:grid;grid-template-columns:2fr 1fr 1.2fr 1.2fr auto;gap:8px}
@media(max-width:700px){form{grid-template-columns:1fr 1fr}}
input,select,button{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);min-width:0}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}button.x{background:none;color:var(--mu);padding:2px 8px}
ul{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.lg{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;font-size:13px}

.hero{background:linear-gradient(120deg,#4f46e5,#7c3aed,#ec4899,#4f46e5);background-size:300% 300%;animation:grad 10s ease infinite;color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:12px;box-shadow:0 10px 30px rgba(79,70,229,.35)}
.hero h1{margin:0}.hero div{opacity:.9;font-size:14px}
@keyframes grad{50%{background-position:100% 50%}}
.c{transition:transform .25s,box-shadow .25s;animation:up .6s backwards}
.c:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.15)}
.k .c:nth-child(2){animation-delay:.1s}.k .c:nth-child(3){animation-delay:.2s}.m .c:nth-child(2){animation-delay:.1s}.m .c:nth-child(3){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
button{transition:transform .15s,filter .2s}button:hover{filter:brightness(1.12)}button:active{transform:scale(.92)}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:1px}
li{animation:inl .4s backwards}@keyframes inl{from{opacity:0;transform:translateX(-20px)}}
#pie path{transform-origin:100px 100px;animation:pop .8s cubic-bezier(.2,.9,.3,1.2) backwards;transition:transform .2s;cursor:pointer}
#pie path:hover{transform:scale(1.07)}
@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-90deg)}}
#bar rect{transform-box:fill-box;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes grow{from{transform:scaleY(0)}}
.pb{height:8px;background:var(--bd);border-radius:6px;margin-top:8px;overflow:hidden}.pb i{display:block;height:100%;border-radius:6px;width:0;transition:width .9s ease,background .4s}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:#111827;color:#fff;padding:10px 18px;border-radius:999px;transition:transform .4s cubic-bezier(.2,.9,.3,1.3);z-index:9;font-size:14px}#toast.s{transform:translate(-50%,0)}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.28;z-index:-1;animation:fl 14s ease-in-out infinite alternate;pointer-events:none}
@keyframes fl{to{transform:translate(40px,60px) scale(1.25)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="blob" style="width:260px;height:260px;background:#7c3aed;top:-60px;left:-60px"></div><div class="blob" style="width:300px;height:300px;background:#ec4899;bottom:-80px;right:-80px;animation-delay:-5s"></div><div class="w">
<div class="hero"><h1>💸 SpendWise</h1><div>Track smart. Spend wise.</div></div>
<div class="g k" style="margin-bottom:12px">
<div class="c"><div class="mu">Total spent</div><div class="big" id="t"></div></div>
<div class="c"><div class="mu">Top category</div><div class="big" id="tc"></div></div>
<div class="c"><div class="mu">Budget left</div><div class="big" id="b"></div><input id="bud" type="number" min="0" style="width:100%;margin-top:6px" placeholder="Set monthly budget ₹"><div class="pb"><i id="pbi"></i></div></div>
</div>
<div class="c" style="margin-bottom:12px"><h2>Add expense</h2>
<form id="f"><input id="ti" placeholder="Title (e.g. Lunch)" required><input id="am" type="number" min="1" step="any" placeholder="₹ Amount" required>
<select id="ca"></select><input id="dt" type="date" required><button>Add</button></form></div>
<div class="g m">
<div class="c"><h2>By category</h2><svg id="pie" viewBox="0 0 200 200" style="width:100%;max-height:220px"></svg><div class="lg" id="lg"></div></div>
<div class="c"><h2>Last 6 months</h2><svg id="bar" viewBox="0 0 300 200" style="width:100%;max-height:240px"></svg></div>
<div class="c" style="grid-column:1/-1"><h2>Recent expenses</h2><ul id="ls"></ul></div>
</div></div>
<div id="toast"></div>
<script>
var CATS={Food:"#f59e0b",Travel:"#3b82f6",Shopping:"#ec4899",Bills:"#ef4444",Study:"#10b981",Other:"#8b5cf6"};
var EM={Food:"🍔",Travel:"🚌",Shopping:"🛍️",Bills:"💡",Study:"📚",Other:"✨"};
function toast(m){var t=$("toast");t.textContent=m;t.className="s";clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=""},1800)}
function cnt(el,to){var f=+el.dataset.v||0,t0=null;el.dataset.v=to;function s(ts){t0=t0||ts;var p=Math.min((ts-t0)/800,1),e=1-Math.pow(1-p,3);el.textContent=inr(f+(to-f)*e);if(p<1)requestAnimationFrame(s)}requestAnimationFrame(s)}
var KEY="spendwise_v1",data=[],budget=0;
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s){data=s.d||[];budget=s.b||0}}catch(e){}
 if(!data.length){var n=new Date(),i,c=Object.keys(CATS);for(i=0;i<18;i++){var d=new Date(n.getFullYear(),n.getMonth()-(i%6),Math.min(1+i*2,27));data.push({id:i,t:["Lunch","Bus pass","Books","Mobile recharge","Shoes","Coffee"][i%6],a:80+(i*137)%900,c:c[i%6],d:d.toISOString().slice(0,10)})}budget=15000}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({d:data,b:budget}))}catch(e){}}
var $=function(i){return document.getElementById(i)};
$("ca").innerHTML=Object.keys(CATS).map(function(c){return"<option value=\""+c+"\">"+EM[c]+" "+c+"</option>"}).join("");
$("dt").value=new Date().toISOString().slice(0,10);
function inr(n){return"₹"+Math.round(n).toLocaleString("en-IN")}
function render(){
 var tot=0,by={},mo={};data.forEach(function(e){tot+=e.a;by[e.c]=(by[e.c]||0)+e.a;var k=e.d.slice(0,7);mo[k]=(mo[k]||0)+e.a});
 cnt($("t"),tot);
 var top=Object.keys(by).sort(function(a,b){return by[b]-by[a]})[0];$("tc").textContent=top||"–";
 var now=new Date().toISOString().slice(0,7),cur=mo[now]||0;
 $("b").textContent=budget?inr(budget-cur):"Not set";$("b").style.color=budget&&cur>budget?"#ef4444":"";$("bud").value=budget||"";var pc=budget?Math.min(cur/budget*100,100):0,pi=$("pbi");pi.style.width=pc+"%";pi.style.background=pc<70?"#10b981":pc<100?"#f59e0b":"#ef4444";
 // donut
 var p="",a0=-Math.PI/2,lg="";
 Object.keys(by).forEach(function(c){var f=by[c]/tot,a1=a0+f*2*Math.PI,l=f>.5?1:0,r=80,ri=50;
  p+='<path fill="'+CATS[c]+'" d="M'+(100+r*Math.cos(a0))+' '+(100+r*Math.sin(a0))+' A80 80 0 '+l+' 1 '+(100+r*Math.cos(a1-.0001))+' '+(100+r*Math.sin(a1-.0001))+' L'+(100+ri*Math.cos(a1-.0001))+' '+(100+ri*Math.sin(a1-.0001))+' A50 50 0 '+l+' 0 '+(100+ri*Math.cos(a0))+' '+(100+ri*Math.sin(a0))+'Z"/>';
  lg+='<span><i class="dot" style="background:'+CATS[c]+'"></i>'+c+' '+Math.round(f*100)+'%</span>';a0=a1});
 $("pie").innerHTML=tot?p:"";$("lg").innerHTML=lg;
 // bars
 var ms=[],n=new Date(),i;for(i=5;i>=0;i--){var d=new Date(n.getFullYear(),n.getMonth()-i,1);ms.push(d.toISOString().slice(0,7))}
 var mx=Math.max.apply(null,ms.map(function(m){return mo[m]||0}).concat([1])),bs="";
 ms.forEach(function(m,j){var v=mo[m]||0,h=v/mx*140,x=15+j*47;
  bs+='<rect x="'+x+'" y="'+(160-h)+'" width="34" height="'+h+'" rx="4" fill="var(--ac)"/><text x="'+(x+17)+'" y="178" font-size="10" text-anchor="middle" fill="var(--mu)">'+m.slice(5)+'/'+m.slice(2,4)+'</text><text x="'+(x+17)+'" y="'+(154-h)+'" font-size="9" text-anchor="middle" fill="var(--tx)">'+(v?Math.round(v/100)/10+"k":"")+'</text>'});
 $("bar").innerHTML=bs;
 // list
 $("ls").innerHTML=data.slice().sort(function(a,b){return a.d<b.d?1:-1}).map(function(e,i){return'<li style="animation-delay:'+Math.min(i,10)*40+'ms"><span><i class="dot" style="background:'+CATS[e.c]+'"></i>'+EM[e.c]+" "+esc(e.t)+' <span class="mu">· '+e.c+' · '+e.d+'</span></span><span><b>'+inr(e.a)+'</b><button class="x" onclick="del('+e.id+')" aria-label="Delete">✕</button></span></li>'}).join("")||'<li class="mu">No expenses yet.</li>';
}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function del(id){data=data.filter(function(e){return e.id!==id});save();render();toast("Expense deleted 🗑️")}
$("f").onsubmit=function(ev){ev.preventDefault();data.push({id:Date.now(),t:$("ti").value.trim(),a:+$("am").value,c:$("ca").value,d:$("dt").value});$("ti").value="";$("am").value="";save();render();toast("Expense added ✅");try{navigator.vibrate(30)}catch(x){}};
$("bud").onchange=function(){budget=+this.value||0;save();render()};
load();render();
</script></body></html>
